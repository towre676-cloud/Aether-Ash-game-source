<!doctype html><html lang="en"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Room architecture · Clay & Water</title><style>*{box-sizing:border-box}body{margin:0;background:#111c21;color:#e7dcc0;font:16px Georgia,serif}header{padding:28px 4vw;border-bottom:1px solid #a9956240}h1{margin:0 0 12px;font-weight:400;font-size:32px}p{color:#b0bfb5;max-width:850px;line-height:1.6}button{background:#273a3d;border:1px solid #a9956250;color:#e7dcc0;padding:10px 16px;border-radius:4px;cursor:pointer;margin-right:8px}main{padding:24px 4vw;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:26px}article{background:#18272b;border:1px solid #a9956230}h2{font-weight:400;font-size:19px;margin:17px}small{display:block;font:12px system-ui;color:#a8bcb0;margin:17px}canvas{width:100%;display:block;background:#0e171d;aspect-ratio:1;object-fit:contain}@media(max-width:800px){main{grid-template-columns:repeat(2,1fr)}}@media(max-width:480px){main{grid-template-columns:1fr}}</style><header><h1>Outside and inside, one place</h1><p>Matching roof shapes, room outlines, window bays and thresholds. The drawings below use the same footprints and furnishings as the playable game.</p><button id="campaign">Public and campaign rooms</button><button id="optional">Hidden rooms</button><span id="count"></span></header><main></main><script type="module">
import{bakeBuilding}from'./engine2/building-art.js?v=5.22.0';import{World}from'./engine2/world.js?v=5.41';import{bakeInterior,drawFurniture}from'./engine2/interiors.js';import{bakeHousehold,drawHouseholdFurniture}from'./engine2/household-render.js?v=5.38';import{cutoutAtlas}from'./engine2/sprite-cutout.js';
const img=new Image();await new Promise((yes,no)=>{img.onload=yes;img.onerror=no;img.src='./engine2/art/furnishings.webp';});const buildings=new Image();await new Promise((yes,no)=>{buildings.onload=yes;buildings.onerror=no;buildings.src='./engine2/art/village-buildings-v3.webp';});const architectureMaterials=new Image();await new Promise((yes,no)=>{architectureMaterials.onload=yes;architectureMaterials.onerror=no;architectureMaterials.src='./engine2/art/architectural-materials-v4.webp';});const cleaned=cutoutAtlas(img,6,4),art={image:cleaned.image,bounds:cleaned.bounds,materials:architectureMaterials};
const source=await fetch('./engine2/world.json').then(r=>r.json()),w=new World(source),all=w.data.scenes.filter(s=>s.household||s.interior).sort((a,b)=>{const order=['home','clinic','inn','instrumentworks','carpenter','guild','pottery_floor','lens_workshop'];const rank=s=>order.includes(s.key)?order.indexOf(s.key):50;return rank(a)-rank(b);});
function show(optional=false){document.querySelector('main').replaceChildren();const rooms=all.filter(s=>optional?s.architecture?.optional:!s.architecture?.optional);document.querySelector('#count').textContent=rooms.length+' rooms';for(const s of rooms){const base=s.household?bakeHousehold(s,art):bakeInterior(s),ctx=base.getContext('2d');if(s.household){ctx.save();ctx.setTransform(1,0,0,1,-(base.worldX||0),-(base.worldY||0));const renderer={ctx,assets:{props:art.image},bounds:{props:art.bounds},label(){}};for(const o of s.household.furnishings)drawHouseholdFurniture(renderer,o,w.state,false);ctx.restore();}else for(const b of s.blocks||[])drawFurniture(ctx,s.interior,b);const cv=document.createElement('canvas');cv.width=cv.height=640;const dc=cv.getContext('2d'),plan=w.data.scenes.flatMap(r=>r.exteriorBuildings||[]).find(p=>p.projection.roomLocation===s.location);if(plan){const roof=bakeBuilding(plan,{buildings,architectureMaterials}),fit=Math.min(560/roof.width,180/roof.height);dc.drawImage(roof,(640-roof.width*fit)/2,8,roof.width*fit,roof.height*fit);dc.fillStyle='#b6c2b2';dc.font='17px Georgia';dc.textAlign='center';dc.fillText(plan.projection.kind==='underground'?'Street stair entrance':'Matching exterior',320,196);}const fit=Math.min(590/base.width,(plan?420:590)/base.height),py=plan?211:20;dc.drawImage(base,(640-base.width*fit)/2,py+(420-base.height*fit)/2,base.width*fit,base.height*fit);const article=document.createElement('article'),title=document.createElement('h2');title.textContent=s.architecture?.style||s.title||s.key;article.append(title,cv);const small=document.createElement('small');small.textContent='Chapter '+s.chapter+' · '+(s.household?.furnishings.length||s.blocks?.length||0)+' furnishings · '+s.doors.length+' exits';article.append(small);document.querySelector('main').append(article);}}
document.querySelector('#campaign').onclick=()=>show();document.querySelector('#optional').onclick=()=>show(true);show();</script></html>
