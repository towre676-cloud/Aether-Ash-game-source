<!doctype html><html lang="en"><meta charset="utf-8"><title>Ash & Aether · media verification</title>
<style>body{margin:0;background:#081116;color:#e9d9b4;font:15px system-ui}header{padding:16px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}button,select{padding:10px;background:#233e43;color:inherit;border:1px solid #607d7d;border-radius:6px}#game{height:76vh;position:relative;overflow:hidden}#status{padding:12px;white-space:pre-wrap}.cinematic-copy{position:absolute;bottom:9%;left:6%;max-width:70%;text-shadow:0 2px 9px #000}.cinematic-copy h2{font-size:28px}.cinematic-copy p{font-size:20px}.cinematic-skip{position:absolute;right:20px;top:20px}#cinematic-stage canvas{width:100%;height:100%;object-fit:contain}#cinematic-stage{position:absolute;inset:0}</style>
<header><strong>Media verification · isolated from saves</strong><button id="wayglass">Wayglass memory</button><button id="cinderfall">Cinderfall memory</button><label><input id="compatible" type="checkbox">Compatibility</label><label><input id="reduced" type="checkbox">Reduced motion</label><select id="bed" aria-label="Soundscape"><option value="town">Commons</option><option value="workshop">Workshop</option><option value="water">Water</option><option value="garden">Garden</option></select><button id="sound">Play ambience</button><button id="stop">Pause ambience</button><label><input id="duck" type="checkbox">Dialogue duck</label></header><div id="game"><canvas id="backdrop" width="1280" height="720" hidden></canvas></div><output id="status"></output>
<script type="module">
import {CinemaDirector} from '../cinema-director.js?v=5.38';
import {installExpansionCinema} from '../expansion-cinema.js?v=5.41';
import {createSoundscape} from '../soundscape.js?v=5.9.0';
const $=s=>document.querySelector(s),data=await fetch('../world.json').then(r=>r.json()),manifest=await fetch('../../music/rpg/manifest.json').then(r=>r.json());
const renderer={canvas:$('#backdrop'),assets:{},bounds:{},compatibility:false},world={state:{party:[0],cinemaSeen:[]}},sound=createSoundscape({storage:{getItem:()=>null,setItem(){}}});
let active=false;
const director=new CinemaDirector({data,renderer,onOpen(){sync(false);},onClose(){updateStatus();}});installExpansionCinema(director,{manifest});
function sync(on=active){active=on;const id=$('#bed').value,scene=id==='town'?{key:'town'}:id==='workshop'?{interior:'loft',household:{kind:'workshop'}}:id==='water'?{key:'river'}:{key:'forest'};sound.sync({scene,state:{mode:'field'},active:on,ducked:$('#duck').checked});updateStatus();}
function updateStatus(){const frame=director.motionMedia.frame({reduced:director.reduced,compatibility:renderer.compatibility});$('#status').textContent=JSON.stringify({cinema:director.entry?.id||null,motionReady:!!frame,videoTime:frame?.currentTime||0,compatibility:renderer.compatibility,reduced:director.reduced,sound:sound.state},null,2);}
function show(id){director.finish();renderer.compatibility=$('#compatible').checked;director.reduced=$('#reduced').checked;director.present(director.get(id),world,{force:true});}
$('#wayglass').onclick=()=>show('world:wayglass');$('#cinderfall').onclick=()=>show('world:household:vale');$('#sound').onclick=()=>{sync(true);sound.unlock();};$('#stop').onclick=()=>sync(false);$('#bed').onchange=()=>sync();$('#duck').onchange=()=>sync();$('#compatible').onchange=()=>{renderer.compatibility=$('#compatible').checked;};$('#reduced').onchange=()=>{director.reduced=$('#reduced').checked;};document.addEventListener('visibilitychange',()=>{if(document.hidden){director.finish();sync(false);}});setInterval(updateStatus,200);updateStatus();
</script></html>
