<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Combat reactions — isolated verification</title><link rel="stylesheet" href="../../combat-relics.css"><style>body{margin:0;background:#101f28;color:#e2d5bb;font:14px system-ui}header{padding:12px;display:flex;gap:7px;flex-wrap:wrap}button,select{padding:9px;color:#eee3c9;background:#23414a;border:1px solid #829b92;border-radius:5px}canvas{width:100vw;height:65vh;display:block}#log{padding:14px;white-space:pre-line;line-height:1.7}#menu{padding:20px}</style><header><strong>Isolated combat verification</strong><button id="reset">Reset · wet arena</button><button data-core="volt">Volt</button><button data-core="frost">Frost</button><button data-core="earth">Earth</button><button data-core="flame">Flame</button><button data-core="tide">Tide</button><button id="strike">Physical strike</button><button id="ward">Shield target</button><button id="echo">Guarded Echo</button><select id="supply" aria-label="Supply"></select><button id="use">Use selected supply</button><button id="relics">Inspect relic loadout</button></header><canvas id="arena" aria-label="Actual battle renderer and reaction effects"></canvas><p id="log" role="status">Loading…</p><div id="menu"></div><script type="module">
import {World} from '../../world.js?v=5.41';import {Renderer} from '../../renderer.js?v=5.41';import {Battle,encounterEnemies} from '../../battle.js?v=5.38';import {compileTechnique} from '../../mako.js?v=5.16.0';import {ITEMS,applySupply} from '../../repertoire.js?v=5.38';import {combatContext} from '../../combat-reactions.js?v=5.38';import {COMBAT_RELICS} from '../../combat-relics.js?v=5.16.0';import {battleRelicMenu} from '../../combat-relics-ui.js?v=5.38';
const q=s=>document.querySelector(s),assets={},events=[];await Promise.all(['crew','creatures','terrain','run','starter','home','materials','buildings','bestiary','bestiary2','props'].map(name=>new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>{assets[name]=i;resolve();};i.onerror=reject;i.src='../../art/'+({run:'crew-run-v2',starter:'sable-starter',home:'home-interior',materials:'world-materials-v3',buildings:'village-buildings-v3',props:'furnishings'}[name]||name)+'.png';})));
const world=new World(await fetch('../../world.json').then(r=>r.json())),renderer=new Renderer(q('#arena'),assets);let battle;function reset(){world.state.scene=49;world.state.chapter=24;world.state.mode='field';world.state.party=[0,1,2];world.state.recruited=[0,1,2];world.state.story.armor=true;world.state.x=world.scene.arrive[0]+.5;world.state.y=world.scene.arrive[1]+.5;world.state.combatRelics={version:1,owned:COMBAT_RELICS.map(r=>r.id),claimed:COMBAT_RELICS.map(r=>r.id)};const enemies=encounterEnemies(3,false,3);enemies.forEach((e,i)=>{e.x=world.state.x+3+i;e.y=world.state.y;e.hp=e.maxHp=10000;e.atb=-100;});for(const [i,h]of world.activeHeroes.entries()){h.x=world.state.x+i*.7;h.y=world.state.y;h.mp=h.maxMp=500;h.hp=h.maxHp=2000;h.strain=0;h.battleRelics=i===0?['stormcoil','riverglass']:[];}battle=new Battle({heroes:world.activeHeroes,enemies,chapter:3,context:combatContext(world),onEvent:e=>{renderer.event(e);if(['reaction','reaction-arc','resource','supply'].includes(e.type))events.push(e.label||e.reaction||e.item?.name||e.resource);if(events.length>8)events.shift();}});enemies.forEach(e=>e.atb=-100);events.length=0;renderer.scene(world);}
function log(){q('#log').textContent='Terrain: '+battle.context.tags.join(', ')+'\nTarget HP '+battle.enemies[0].hp+' · '+Object.entries(battle.enemies[0].status).map(([k,v])=>k+': '+Math.round(v*10)/10).join(' · ')+'\n'+events.join(' → ');}
function cast(core,support='focus'){const h=battle.heroes[0];h.atb=1;h.mp=500;h.strain=0;battle.command(h.id,'tech',battle.enemies[0].id,compileTechnique(core,support));log();}
q('#reset').onclick=reset;for(const b of document.querySelectorAll('[data-core]'))b.onclick=()=>cast(b.dataset.core);q('#strike').onclick=()=>{battle.heroes[0].atb=1;battle.command(0,'attack',battle.enemies[0].id);log();};q('#ward').onclick=()=>{battle.enemies[0].status.shield=150;log();};q('#echo').onclick=()=>{battle.heroes[0].battleRelics=['bellrest','stormcoil'];battle.heroes[0].status.guard=5;cast('gale','echo');};for(const item of ITEMS){const option=document.createElement('option');option.value=item.id;option.textContent=item.name;q('#supply').append(option);}q('#use').onclick=()=>{const id=q('#supply').value,h=battle.heroes[0];h.atb=1;applySupply(battle,{[id]:1},id,h,battle.enemies[0]);log();};q('#relics').onclick=()=>q('#menu').replaceChildren(battleRelicMenu(world,()=>{},()=>q('#menu').replaceChildren()));reset();let last=0;function frame(t){const dt=Math.min(.05,(t-last)/1000||.016);last=t;battle.advance(dt);renderer.draw(world,battle,dt);log();requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script>
