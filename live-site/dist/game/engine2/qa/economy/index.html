<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Common Exchange · diagnostic market</title><link rel="stylesheet" href="../../economy.css"><style>body{background:#081820;color:#eee;padding:20px;margin:auto;max-width:1100px}nav{display:flex;gap:8px;flex-wrap:wrap}nav button{background:#28474a;color:#eee;padding:10px;border:1px solid #ba9e68;border-radius:6px}h1{font:26px Georgia}</style><h1>Common Exchange · diagnostic market</h1><p>This isolated arena uses the real economy and authored vendor/workbench sites. It does not read or modify player saves. Seed: 500 credits, six bundles of each material, chapter 3.</p><nav><button id="market-one">Visit Cinderfall merchant</button><button id="market-two">Visit Brakehaven workbench</button><button id="protect">Resolve two distinct diagnostic encounters</button><button id="ledger">View satchel away from merchant</button><button id="reset">Reset diagnostic economy</button></nav><main id="panel"></main><script type="module">
import {World} from '../../world.js?v=5.41';import {installTownLife} from '../../townlife.js?v=5.38';import {installRegionalLife} from '../../regional-life.js?v=5.38';import {economyPanel} from '../../economy-ui.js?v=5.38';import {economyState,encounterSalvage} from '../../economy.js?v=5.18.0';
const data=await fetch('../../world.json').then(r=>r.json());let w,merchant,serial=0;function paint(){document.querySelector('#panel').replaceChildren(economyPanel({world:w,merchant,onSave(){},onBack(){merchant=null;paint();}}));}function visit(r){w.state.scene=r===1?17:214;w.state.mode='field';const o=w.objects().find(o=>r===1?o.type==='shop':o.regional&&o.lifeKind==='project');if(!o)throw Error('Authored vendor not found');w.state.x=o.xy[0]+.5;w.state.y=o.xy[1]+1;merchant={scene:w.state.scene,xy:o.xy};paint();}function reset(){w=new World(data);w.state.chapter=3;w.state.mode='field';w.state.gold=500;Object.assign(economyState(w.state).goods,{metal:6,fiber:6,glass:6});installTownLife(w);installRegionalLife(w);visit(1);}document.querySelector('#market-one').onclick=()=>visit(1);document.querySelector('#market-two').onclick=()=>visit(2);document.querySelector('#protect').onclick=()=>{for(let i=0;i<2;i++)encounterSalvage(w.state,{key:'diagnostic-'+serial++,type:'patrol',core:'earth'});paint();};document.querySelector('#ledger').onclick=()=>{merchant=null;paint();};document.querySelector('#reset').onclick=reset;reset();
</script></html>
