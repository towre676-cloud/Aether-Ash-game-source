<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Battle flow verification</title><link rel="stylesheet" href="../style.css"><style>body{overflow:auto;padding:30px;background:#0b1922;color:#f8e9c9;font:17px system-ui}#commands{position:static;max-width:780px;width:auto;transform:none}button{padding:12px}#log{white-space:pre-line}progress{accent-color:#8bd9bd}</style><h1>Practice skirmish · engine verification</h1><p>Real battle rules and the same controls used by the game. This isolated check does not change your campaign save.</p><button id="new">Start fresh round</button><button id="strike">Attack when ready</button><button id="pause">Pause drill</button><section id="commands"></section><p id="log" role="status">Ready</p><p id="time"></p><script type="module">
import {Battle,encounterEnemies}from '../battle.js?v=5.38';import {defaultHero}from '../mako.js?v=5.16.0';import {mountBattleFlow}from '../battle-flow.js?v=5.38';let b,target,paused=false;const heroes=[defaultHero(0,4),defaultHero(1,4)],world={state:{xp:0},activeHeroes:heroes};const log=document.querySelector('#log');const flow=mountBattleFlow({getBattle:()=>b,getWorld:()=>world,getTarget:()=>target,setTarget:id=>target=id});function start(){heroes.forEach((h,i)=>{h.hp=h.maxHp;h.x=i;h.y=0;});const enemies=encounterEnemies(1,false,2);enemies.forEach((e,i)=>{e.x=4+i;e.y=0;});b=new Battle({heroes,enemies,onEvent:e=>{if(e.type==='end'){if(e.result==='win')world.state.xp+=65;log.textContent=e.result==='win'?'Victory · +65 XP · start another round':'Defeat · start another round';}else if(e.type==='damage')log.textContent=e.actor.name+' takes '+e.amount;}});target=enemies[0].id;log.textContent='Watch the enemy intentions. Auto attack is optional.';}
document.querySelector('#new').onclick=start;document.querySelector('#strike').onclick=()=>{const h=b?.ready[0];if(h)b.command(h.id,'attack',target);};document.querySelector('#pause').onclick=()=>{paused=!paused;document.querySelector('#pause').textContent=paused?'Resume drill':'Pause drill';};let last=0,draw=0;function frame(t){const dt=Math.min(.05,(t-(last||t))/1000);last=t;if(!paused)flow.step(dt);if(t-draw>150){flow.draw();document.querySelector('#time').textContent=b?'Battle time '+b.time.toFixed(1)+' s · '+b.ready.length+' ready':'';draw=t;}requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>
