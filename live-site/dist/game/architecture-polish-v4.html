import{World}from'./engine2/world.js?v=5.41';import{PHYSICAL_LORE}from'./engine2/physical-lore-content.js';import{physicalBindings,tickPhysical}from'./engine2/physical-lore.js?v=5.16.0';import{Renderer}from'./engine2/renderer.js?v=5.41';const assets={},names={architectureMaterials:'architectural-materials-v4',crew:'crew',run:'crew-run-v2',starter:'sable-starter',home:'home-interior',terrain:'terrain',creatures:'creatures',props:'furnishings',materials:'world-materials-v3',buildings:'village-buildings-v3',bestiary:'bestiary',bestiary2:'bestiary2'};await Promise.all(Object.entries(names).map(([key,name])=>new Promise((yes,no)=>{const i=new Image();i.onload=()=>{assets[key]=i;yes();};i.onerror=()=>{if(key==='bestiary2'){yes();return;}no(Error(name));};i.src='./engine2/art/'+name+'.webp';})));const data=await fetch('./engine2/world.json').then(r=>r.json()),w=new World(data),r=new Renderer(document.querySelector('#screen'),assets);w.state.story.parcel=true;w.state.story.firstCore=true;w.state.mode='field';w.state.party=[0];w.state.chapter=24;w.setBit(8323526,1);let key='town';const chain=document.querySelector('#chain');chain.innerHTML=PHYSICAL_LORE.map(e=>'<option value="'+e.id+'">'+e.name+'</option>').join('');function visit(role){const o=physicalBindings(w).find(o=>o.physicalId===chain.value&&o.physicalRole===role);w.state.scene=o.physicalLocation;const d=[[0,1],[1,0],[-1,0],[0,-1]].find(([x,y])=>w.scene.floor[o.xy[1]+y]?.[o.xy[0]+x]==='.')||[0,0];w.state.x=o.xy[0]+d[0]+.5;w.state.y=o.xy[1]+d[1]+.5;w.state.mode='field';r.scene(w);document.querySelector('#status').textContent=o.label;}document.querySelector('#source').onclick=()=>visit('source');document.querySelector('#receiver').onclick=()=>visit('device');document.querySelector('#act').onclick=()=>{const o=w.objects().filter(o=>o.physicalId===chain.value&&o.physicalRole!=='reward').sort((a,b)=>Math.hypot(w.state.x-a.xy[0]-.5,w.state.y-a.xy[1]-.5)-Math.hypot(w.state.x-b.xy[0]-.5,w.state.y-b.xy[1]-.5))[0];w.interact(o);};w.callbacks.onNotice=t=>document.querySelector('#status').textContent=t;function scene(k){const s=w.data.scenes.find(s=>s.key===k);w.state.scene=s.location;const p=s.arrive;w.state.x=p[0]+.5;w.state.y=p[1]+.5;w.state.mode='field';r.scene(w);key=k;document.querySelector('#status').textContent=s.architecture?.style||'Cinderfall · arrows to walk';}document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>scene(b.dataset.scene));const keys=new Set();addEventListener('keydown',e=>{keys.add(e.key);if(e.key.startsWith('Arrow'))e.preventDefault();});addEventListener('keyup',e=>keys.delete(e.key));addEventListener('resize',()=>r.resize());document.querySelector('#phone').onclick=()=>{const cv=document.querySelector('#screen'),phone=cv.style.width!=='390px';cv.style.width=phone?'390px':'100vw';cv.style.height=phone?'720px':'calc(100vh - 66px)';cv.style.margin=phone?'0 auto':'0';r.resize();document.querySelector('#phone').textContent=phone?'Wide view':'Phone view';};scene('town');let prior=0;function frame(now){const dt=Math.min(.04,(now-prior)/1000||0);prior=now;w.move(((keys.has('ArrowRight')?1:0)-(keys.has('ArrowLeft')?1:0))*dt*4,((keys.has('ArrowDown')?1:0)-(keys.has('ArrowUp')?1:0))*dt*4);tickPhysical(w,dt);r.draw(w,null,dt);requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script>
