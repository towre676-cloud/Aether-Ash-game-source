<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Clay & Water · Environment review</title><style>*{box-sizing:border-box}body{margin:0;background:#101b20;color:#e6dbc1;font:14px system-ui}header{height:66px;display:flex;gap:12px;align-items:center;padding:10px 22px;border-bottom:1px solid #44615e}strong{font:19px Georgia}select,button{background:#243c3f;color:#e6dbc1;border:1px solid #668782;padding:9px;border-radius:6px}label{display:flex;gap:8px;align-items:center}#status{margin-left:auto;font-size:12px;max-width:350px}canvas{display:block;width:100vw;height:calc(100vh - 66px)}@media(max-width:700px){header{height:120px;flex-wrap:wrap;padding:8px}canvas{height:calc(100vh - 120px)}#status{margin:0}}
</style><header><strong>Clay & Water</strong><select id="scenes" aria-label="Scene"></select><label>Light <select id="time" aria-label="Time"><option value="600">Morning</option><option value="780">Midday</option><option value="1080">Dusk</option><option value="1380">Night</option></select></label><button id="recenter">Find entrance</button><span id="status">Preparing…</span></header><canvas id="screen" aria-label="Playable environment review" tabindex="0"></canvas><script type="module">
import {World} from './engine2/world.js?v=5.41';import {Renderer} from './engine2/renderer.js?v=5.41';import {installTownLife} from './engine2/townlife.js?v=5.38';import {installRegionalLife} from './engine2/regional-life.js?v=5.38';
const canvas=document.querySelector('canvas'),select=document.querySelector('#scenes'),time=document.querySelector('#time'),status=document.querySelector('#status');
const names={architectureMaterials:'architectural-materials-v4.webp',crew:'crew.webp',run:'crew-run-v2.webp',starter:'sable-starter.webp',home:'home-interior.webp',terrain:'terrain.webp',creatures:'creatures.webp',props:'furnishings.webp',materials:'world-materials-v3.webp',buildings:'village-buildings-v3.webp',bestiary:'bestiary.webp',bestiary2:'bestiary2.webp',bestiary3:'bestiary3.webp',naturalTrees:'natural-trees-v8.webp',npcs:'civilians.webp',village:'village-life-v2.webp',roomLife:'occupied-workstations-v6.webp'},assets={};
try{await Promise.all(Object.entries(names).map(([key,name])=>new Promise((yes,no)=>{let image=new Image();image.onload=()=>{assets[key]=image;yes()};image.onerror=()=>no(Error('Missing '+name));image.src='./engine2/art/'+name;})));
const w=new World(await fetch('./engine2/world.json').then(r=>r.json())),r=new Renderer(canvas,assets);installTownLife(w);installRegionalLife(w);w.state.story.parcel=true;w.state.story.armor=true;w.state.story.firstCore=true;w.state.party=[0,1,2];w.state.townLife={minutes:600,day:1,parcels:{},delivered:[]};
const choices=[['Cinderfall streets',s=>s.key==='town'],['Family home',s=>s.key==='home'],['Coaching inn',s=>s.key==='inn'],['Infirmary',s=>s.key==='clinic'],['Instrument maker',s=>s.key==='instrumentworks'],['Archive east wing',s=>s.chapter===5&&s.key==='east'],['Archive west wing',s=>s.chapter===5&&s.key==='west'],['Riverbank',s=>s.key==='river'],['Garden sanctuary',s=>s.key==='sanctuary'],['Frontier forest',s=>s.biome?.style==='spore'],['Tidal frontier',s=>s.biome?.style==='mangrove'],['Frozen frontier',s=>s.biome?.style==='aurora'],['Foundry',s=>s.key==='security']].map(([label,p])=>({label,scene:w.data.scenes.find(p)})).filter(v=>v.scene);
for(let i=0;i<choices.length;i++)select.add(new Option(choices[i].label,i));
function enter(){const s=choices[+select.value].scene;w.state.scene=s.location;w.state.chapter=s.chapter;w.state.mode='field';const p=s.arrive;w.state.x=p[0]+.5;w.state.y=p[1]+.5;r.scene(w);canvas.focus();}
select.onchange=enter;time.onchange=()=>{w.state.townLife.minutes=+time.value;};document.querySelector('#recenter').onclick=enter;addEventListener('resize',()=>r.resize());
const keys=new Set();addEventListener('keydown',e=>{if(e.target.tagName==='SELECT')return;keys.add(e.key);if(e.key.startsWith('Arrow'))e.preventDefault();});addEventListener('keyup',e=>keys.delete(e.key));addEventListener('blur',()=>keys.clear());enter();let last=performance.now(),report=0;
function frame(now){const dt=Math.min(.04,(now-last)/1000);last=now;const x=+keys.has('ArrowRight')-+keys.has('ArrowLeft'),y=+keys.has('ArrowDown')-+keys.has('ArrowUp'),length=Math.hypot(x,y)||1,speed=keys.has('z')?6:3.3;w.move(x/length*speed*dt,y/length*speed*dt);w.townLife.update(dt);r.draw(w,null,dt);if(now-report>750){report=now;status.textContent=choices[+select.value].label+' · arrows walk · Z run · '+r.frameMs.toFixed(1)+' ms/frame';}requestAnimationFrame(frame);}requestAnimationFrame(frame);
}catch(e){status.textContent=e.message;console.error(e);}
</script></html>
