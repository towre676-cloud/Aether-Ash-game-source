name: Festival catastrophe - playable integration

on:
  pull_request:
    paths:
      - 'live-site/dist/game/engine2/festival-crisis.js'
      - 'live-site/dist/game/engine2/opening.js'
      - 'live-site/dist/game/engine2/world.js'
      - 'live-site/dist/game/engine2/adventure-world-props.js'
      - 'live-site/dist/game/engine2/tests/festival-crisis*.test.mjs'
      - '.github/workflows/festival-crisis.yml'
  push:
    branches:
      - main
    paths:
      - 'live-site/dist/game/engine2/festival-crisis.js'
      - 'live-site/dist/game/engine2/opening.js'
      - 'live-site/dist/game/engine2/world.js'
      - 'live-site/dist/game/engine2/adventure-world-props.js'
      - 'live-site/dist/game/engine2/tests/festival-crisis*.test.mjs'
      - '.github/workflows/festival-crisis.yml'

jobs:
  festival-opening:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check world integration syntax
        run: |
          node --check live-site/dist/game/engine2/festival-crisis.js
          node --check live-site/dist/game/engine2/opening.js
          node --check live-site/dist/game/engine2/world.js
          node --check live-site/dist/game/engine2/adventure-world-props.js
      - name: Test rescued civilians, relay, saved progress and dynamic scene geometry
        run: node --test live-site/dist/game/engine2/tests/festival-crisis.test.mjs live-site/dist/game/engine2/tests/festival-crisis-render.test.mjs live-site/dist/game/engine2/tests/festival-crisis-integration.test.mjs
