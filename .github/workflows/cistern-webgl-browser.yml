name: Cistern same-origin WebGL smoke
on:
  pull_request:
    paths:
      - 'live-site/dist/game/engine2/cistern-renderer.js'
      - 'live-site/dist/game/engine2/art/cistern/**'
      - 'tests/cistern-webgl-browser.mjs'
      - '.github/workflows/cistern-webgl-browser.yml'
  workflow_dispatch:
jobs:
  webgl:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependency
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve complete game and assets from one origin
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/ash-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/live-site/dist/game/index.html -o /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ash-preview.log
          exit 1
      - name: Check WebGL image upload in real Chromium
        run: node tests/cistern-webgl-browser.mjs
