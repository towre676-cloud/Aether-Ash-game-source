name: Action RPG combat core
on:
  pull_request:
    paths:
      - 'live-site/dist/game/action-rpg-combat-core.mjs'
      - 'live-site/dist/game/engine2/action-rpg-bar.js'
      - 'live-site/dist/game/engine2/action-combat-feedback.js'
      - 'live-site/dist/game/engine2/main.js'
      - 'tests/action-rpg-combat-core.test.mjs'
      - '.github/workflows/action-rpg-combat.yml'
  push:
    branches: [main]
    paths:
      - 'live-site/dist/game/action-rpg-combat-core.mjs'
      - 'live-site/dist/game/engine2/action-rpg-bar.js'
      - 'live-site/dist/game/engine2/action-combat-feedback.js'
      - 'live-site/dist/game/engine2/main.js'
      - 'tests/action-rpg-combat-core.test.mjs'
      - '.github/workflows/action-rpg-combat.yml'
jobs:
  combat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate module syntax
        run: |
          node --check live-site/dist/game/action-rpg-combat-core.mjs
          node --check live-site/dist/game/engine2/action-rpg-bar.js
          node --check live-site/dist/game/engine2/action-combat-feedback.js
          node --check live-site/dist/game/engine2/main.js
      - name: Run deterministic combat tests
        run: node --test tests/action-rpg-combat-core.test.mjs
