name: Reconcile against publicly served current Site code (no deployment)
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch exact public current game scripts without modifying the Site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-live-current/game/engine2
          for file in world.js main.js adventure-3d-geometry.js field-journey-ui.js field-encounters.js adventure-3d-renderer.js renderer.js room-map.js; do
            curl --fail --silent --show-error --location --retry 2 --connect-timeout 15 --max-time 60 \
              "https://ash-aether-clay-water.towre676.chatgpt.site/game/engine2/$file" \
              --output "qa-live-current/game/engine2/$file"
            node --check "qa-live-current/game/engine2/$file"
          done
      - name: Create fail-closed overlay of modern live source
        run: |
          node scripts/stage-live-living-regions.mjs qa-live-current qa-live-review
          for file in qa-live-review/game/engine2/*; do
            case "$file" in *.js|*.mjs) node --check "$file";; esac
          done
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('qa-live-review/LIVING-REGIONS-STAGING.json'));if(m.deployed||m.files.length!==13||m.files.some(x=>!x.newSha256))process.exit(1);console.log('Actual current Site 13-file staging verified; no deployment')"
      - name: Retain patched current Site sources with provenance for review
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: living-regions-current-site-review-only
          path: qa-live-review/
          if-no-files-found: error
          retention-days: 7

      - name: Install lightweight Chrome test driver
        run: |
          cd scripts/qa
          npm install --no-package-lock --no-save --ignore-scripts playwright-core@1.56.1
          test -x /usr/bin/google-chrome
      - name: Run modern actual-Site browser with staged overlay, no publication
        env:
          CHROME_BIN: /usr/bin/google-chrome
          QA_MOBILE: '1'
        run: node scripts/qa/browser-current-overlay.mjs
      - name: Archive desktop and mobile preview receipts, even on failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: living-regions-modern-inbrowser-qa
          path: qa-artifacts-live-overlay/
          if-no-files-found: ignore
          retention-days: 7
