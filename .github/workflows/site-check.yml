name: Validate public game showcase
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-site.mjs
      - run: node --test live-site/dist/game/engine2/tests/vast-spatial-expansion.test.mjs
