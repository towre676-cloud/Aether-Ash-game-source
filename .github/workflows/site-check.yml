name: Validate public game showcase
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-site.mjs
      - run: node --test live-site/dist/game/engine2/tests/vast-spatial-expansion.test.mjs
      - run: node --test live-site/dist/game/engine2/tests/macro-region-phase2.test.mjs live-site/dist/game/engine2/tests/spatial-landmark-art.test.mjs
      - run: node --test live-site/dist/game/engine2/tests/frontiers.test.mjs live-site/dist/game/engine2/tests/field-origins.test.mjs live-site/dist/game/engine2/tests/quest-navigation.test.mjs
      - run: node --test live-site/dist/game/engine2/tests/adventure-dungeon-architecture.test.mjs live-site/dist/game/engine2/tests/world-affordance-layout.test.mjs
